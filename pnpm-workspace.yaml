allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Security patches for transitive deps of the Sanity CLI (`sanity` → `@sanity/cli`),
# pinned within their current major so the CLI keeps working. Tooling only: none of
# these reach the static site. Remove once `sanity` ships the patched versions.
# Not overridden (major bump required, moderate): uuid 10 → 11, minimatch 10 → 11.
overrides:
  "js-yaml@>=3.0.0 <3.15.2": "^3.15.2"
  "smol-toml@<1.9.0": "^1.9.1"
  "undici@>=7.0.0 <7.30.1": "^7.30.2"
  # parse5-parser-stream 8.1 declares parse5 ^8.0.0 but calls an 8.1 API; deduped to the
  # 8.0.1 that Sanity's jsdom pulls in, it crashes jsdom 31 (integration tests) on start.
  "parse5-parser-stream>parse5": "^8.1.0"
