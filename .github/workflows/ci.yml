name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # E2E tests (LAN-173) join this workflow when they exist.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads pnpm from package.json#packageManager and Node from .nvmrc,
      # then runs a frozen-lockfile install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Optional: src/sanity/env.ts falls back to the production project when unset.
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}

      # Serves dist/ like production (_headers, 404 page) without a Cloudflare
      # account, so a PR that breaks routing, the 404 page, the sitemap or the
      # feeds fails here, before any deploy (LAN-152).
      - name: Smoke test on wrangler dev
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          pnpm exec wrangler dev --port 8787 > wrangler.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null' EXIT
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8787/ && break
            sleep 1
          done
          if ! curl -s -o /dev/null http://localhost:8787/; then
            echo "wrangler dev did not answer within 60 s:"
            cat wrangler.log
            exit 1
          fi
          pnpm smoke http://localhost:8787
